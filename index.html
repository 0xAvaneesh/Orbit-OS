
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">ORBIT OS</div>
        <div id="clock"></div>
    </header>

    <main class="desktop">
        <section class="window welcome" id="welcome">
            <div class="titlebar">
                <div class="controls">
                    <button class="red" data-close="welcome"></button>
                    <button class="yellow" data-minimize="welcome"></button>
                    <button class="green"></button>
                </div>
                <span>Welcome</span>
            </div>

            <div class="content">
                <h1>Welcome to Orbit.</h1>
                <p>A simple desktop built for the web.</p>

                <div class="apps">
                    <button data-open="notes">Notes</button>
                    <button data-open="calculator">Calculator</button>
                    <button data-open="files">Files</button>
                    <button data-open="settings">Settings</button>
                </div>
            </div>
        </section>

        <section class="window app-window" id="notes" hidden>
            <div class="titlebar">
                <div class="controls">
                    <button class="red" data-close="notes"></button>
                    <button class="yellow" data-minimize="notes"></button>
                    <button class="green"></button>
                </div>
                <span>Notes</span>
            </div>
            <div class="content">
                <textarea id="noteText" placeholder="Write something..."></textarea>
            </div>
        </section>

        <section class="window app-window" id="calculator" hidden>
            <div class="titlebar">
                <div class="controls">
                    <button class="red" data-close="calculator"></button>
                    <button class="yellow" data-minimize="calculator"></button>
                    <button class="green"></button>
                </div>
                <span>Calculator</span>
            </div>
            <div class="content">
                <input id="calcDisplay" placeholder="Enter a calculation">
                <button id="calculate">Calculate</button>
                <p id="calcResult"></p>
            </div>
        </section>

        <section class="window app-window" id="files" hidden>
            <div class="titlebar">
                <div class="controls">
                    <button class="red" data-close="files"></button>
                    <button class="yellow" data-minimize="files"></button>
                    <button class="green"></button>
                </div>
                <span>Files</span>
            </div>
            <div class="content">
                <p>My Files</p>
                <div class="file">📁 Documents</div>
                <div class="file">📁 Downloads</div>
                <div class="file">📄 Welcome.txt</div>
            </div>
        </section>

        <section class="window app-window" id="settings" hidden>
            <div class="titlebar">
                <div class="controls">
                    <button class="red" data-close="settings"></button>
                    <button class="yellow" data-minimize="settings"></button>
                    <button class="green"></button>
                </div>
                <span>Settings</span>
            </div>
            <div class="content">
                <p>Desktop appearance</p>
                <button id="changeBackground">Change background</button>
            </div>
        </section>
    </main>

    <nav class="dock">
        <button data-open="welcome">⌂</button>
        <button data-open="notes">N</button>
        <button data-open="calculator">C</button>
        <button data-open="files">F</button>
        <button data-open="settings">⚙</button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
