<!DOCTYPE html>
<html>

<head>
  <title>Orbit OS</title>

  <style>
    .dock-app {
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .dock-app:hover {
      transform: translateY(-8px) scale(1.12);
      background: rgba(255,255,255,0.18) !important;
    }

    .dock-app:active {
      transform: translateY(-4px) scale(1.04);
    }

    .app-window {
      position: absolute;
      padding: 20px;
      border-radius: 18px;
      background: rgba(15,20,35,0.38);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      display: none;
    }

    .app-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      cursor: move;
      user-select: none;
    }

    .app-close {
      color: #ff5f57;
      cursor: pointer;
    }

    button {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: white;
      border-radius: 8px;
      padding: 9px;
      cursor: pointer;
    }

    button:hover {
      background: rgba(255,255,255,0.18);
    }
  </style>
</head>

<body style="
  background-image: url('https://svs.gsfc.nasa.gov/vis/a010000/a014100/a014146/runaway_black_hole_desktop.png');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  color: white;
  font-family: Arial, sans-serif;
  margin: 0;
">

  <div style="
    height: 45px;
    background: rgba(10,10,10,0.35);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  ">
    <span>ORBIT OS</span>
    <span id="clock" style="color:#ddd;"></span>
  </div>


  <div id="window" style="
    width: 520px;
    padding: 30px;
    border-radius: 20px;
    background: rgba(15,20,35,0.35);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
  ">

    <div id="titlebar" style="
      display:flex;
      align-items:center;
      justify-content:space-between;
      cursor:move;
    ">

      <div>
        <span id="close" style="color:#ff5f57;cursor:pointer;">●</span>
        <span id="minimize" style="color:#febc2e;cursor:pointer;">●</span>
        <span style="color:#28c840;">●</span>
      </div>

      <span style="color:#d0d5df;font-size:13px;">Welcome</span>

      <span style="width:45px;"></span>

    </div>

    <h1 style="
      text-align:center;
      font-size:36px;
      margin-bottom:20px;
    ">
      ORBIT OS
    </h1>

  </div>


  <div id="notes" class="app-window" style="
    width:400px;
    top:25%;
    left:15%;
  ">

    <div class="app-title" data-window="notes">

      <div>
        <span class="app-close" onclick="closeApp('notes')">●</span>
        <span style="color:#febc2e;">●</span>
        <span style="color:#28c840;">●</span>
      </div>

      <span style="color:#d0d5df;font-size:13px;">Notes</span>
      <span style="width:40px;"></span>

    </div>

    <h2>Notes</h2>

    <textarea style="
      width:100%;
      height:180px;
      box-sizing:border-box;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);
      border-radius:10px;
      color:white;
      padding:10px;
      resize:none;
      outline:none;
    " placeholder="Write something..."></textarea>

  </div>


  <div id="calculator" class="app-window" style="
    width:280px;
    top:20%;
    left:40%;
  ">

    <div class="app-title" data-window="calculator">

      <div>
        <span class="app-close" onclick="closeApp('calculator')">●</span>
        <span style="color:#febc2e;">●</span>
        <span style="color:#28c840;">●</span>
      </div>

      <span style="color:#d0d5df;font-size:13px;">Calculator</span>
      <span style="width:40px;"></span>

    </div>

    <input id="calcDisplay" type="text" readonly style="
      width:100%;
      box-sizing:border-box;
      padding:12px;
      margin-bottom:10px;
      background:rgba(0,0,0,0.25);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:10px;
      color:white;
      font-size:22px;
      text-align:right;
    ">

    <div style="
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:7px;
    ">

      <button onclick="calc('7')">7</button>
      <button onclick="calc('8')">8</button>
      <button onclick="calc('9')">9</button>
      <button onclick="calc('/')">÷</button>

      <button onclick="calc('4')">4</button>
      <button onclick="calc('5')">5</button>
      <button onclick="calc('6')">6</button>
      <button onclick="calc('*')">×</button>

      <button onclick="calc('1')">1</button>
      <button onclick="calc('2')">2</button>
      <button onclick="calc('3')">3</button>
      <button onclick="calc('-')">−</button>

      <button onclick="calc('0')">0</button>
      <button onclick="calc('.')">.</button>
      <button onclick="calculate()">=</button>
      <button onclick="calc('+')">+</button>

      <button onclick="clearCalc()" style="grid-column:span 4;">
        Clear
      </button>

    </div>

  </div>


  <div id="files" class="app-window" style="
    width:420px;
    top:18%;
    left:25%;
  ">

    <div class="app-title" data-window="files">

      <div>
        <span class="app-close" onclick="closeApp('files')">●</span>
        <span style="color:#febc2e;">●</span>
        <span style="color:#28c840;">●</span>
      </div>

      <span style="color:#d0d5df;font-size:13px;">Files</span>
      <span style="width:40px;"></span>

    </div>

    <h2>Files</h2>

    <div style="
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
    ">

      <div style="
        padding:18px;
        background:rgba(255,255,255,0.07);
        border-radius:12px;
      ">
        📁 Documents
      </div>

      <div style="
        padding:18px;
        background:rgba(255,255,255,0.07);
        border-radius:12px;
      ">
        📁 Pictures
      </div>

      <div style="
        padding:18px;
        background:rgba(255,255,255,0.07);
        border-radius:12px;
      ">
        📁 Projects
      </div>

    </div>

  </div>


  <div id="browser" class="app-window" style="
    width:500px;
    top:15%;
    left:35%;
  ">

    <div class="app-title" data-window="browser">

      <div>
        <span class="app-close" onclick="closeApp('browser')">●</span>
        <span style="color:#febc2e;">●</span>
        <span style="color:#28c840;">●</span>
      </div>

      <span style="color:#d0d5df;font-size:13px;">Browser</span>
      <span style="width:40px;"></span>

    </div>

    <input placeholder="Search the web..." style="
      width:100%;
      box-sizing:border-box;
      padding:12px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);
      border-radius:10px;
      color:white;
      outline:none;
    ">

    <p style="color:#aaa;">
      ORBIT Browser
    </p>

  </div>


  <div id="terminal" class="app-window" style="
    width:500px;
    top:35%;
    left:30%;
    background:rgba(5,8,12,0.55);
  ">

    <div class="app-title" data-window="terminal">

      <div>
        <span class="app-close" onclick="closeApp('terminal')">●</span>
        <span style="color:#febc2e;">●</span>
        <span style="color:#28c840;">●</span>
      </div>

      <span style="color:#d0d5df;font-size:13px;">Terminal</span>
      <span style="width:40px;"></span>

    </div>

    <div id="terminalText" style="
      font-family:monospace;
      color:#ddd;
      min-height:150px;
    ">

      ORBIT Terminal<br>
      Type "help" to see commands.<br><br>

      orbit@desktop:~$

      <input id="terminalInput" style="
        background:none;
        border:none;
        outline:none;
        color:white;
        font-family:monospace;
        width:250px;
      ">

    </div>

  </div>


  <div id="settings" class="app-window" style="
    width:400px;
    top:22%;
    left:55%;
  ">

    <div class="app-title" data-window="settings">

      <div>
        <span class="app-close" onclick="closeApp('settings')">●</span>
        <span style="color:#febc2e;">●</span>
        <span style="color:#28c840;">●</span>
      </div>

      <span style="color:#d0d5df;font-size:13px;">Settings</span>
      <span style="width:40px;"></span>

    </div>

    <h2>Settings</h2>

    <p>Appearance</p>

    <button onclick="document.body.style.backgroundColor='#050505'">
      Dark mode
    </button>

    <p style="color:#aaa;">
      ORBIT OS settings
    </p>

  </div>


  <div id="dock" style="
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px;
    background:rgba(12,16,25,0.38);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:22px;
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
    box-shadow:0 15px 45px rgba(0,0,0,0.45);
  ">


    <div class="dock-app"
      title="Files"
      onclick="openApp('files')"
      style="
        width:52px;
        height:52px;
        border-radius:15px;
        background:rgba(255,255,255,0.1);
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
      ">

      <svg width="28" height="28" viewBox="0 0 24 24"
        fill="none" stroke="white" stroke-width="1.7">
        <path d="M3 6.5A2.5 2.5 0 0 1 5.5 4H10l2 2h6.5A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/>
      </svg>

    </div>


    <div class="dock-app"
      title="Notes"
      onclick="openApp('notes')"
      style="
        width:52px;
        height:52px;
        border-radius:15px;
        background:rgba(255,255,255,0.1);
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
      ">

      <svg width="28" height="28" viewBox="0 0 24 24"
        fill="none" stroke="white" stroke-width="1.7">
        <rect x="5" y="3" width="14" height="18" rx="2"/>
        <path d="M8 8h8M8 12h8M8 16h5"/>
      </svg>

    </div>


    <div class="dock-app"
      title="Calculator"
      onclick="openApp('calculator')"
      style="
        width:52px;
        height:52px;
        border-radius:15px;
        background:rgba(255,255,255,0.1);
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
      ">

      <svg width="28" height="28" viewBox="0 0 24 24"
        fill="none" stroke="white" stroke-width="1.7">
        <rect x="5" y="3" width="14" height="18" rx="2"/>
        <path d="M8 7h8"/>
        <path d="M8 11h1M12 11h1M16 11h1"/>
        <path d="M8 15h1M12 15h1M16 15h1"/>
        <path d="M8 18h8"/>
      </svg>

    </div>


    <div class="dock-app"
      title="Browser"
      onclick="openApp('browser')"
      style="
        width:52px;
        height:52px;
        border-radius:15px;
        background:rgba(255,255,255,0.1);
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
      ">

      <svg width="28" height="28" viewBox="0 0 24 24"
        fill="none" stroke="white" stroke-width="1.7">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12h18"/>
        <path d="M12 3c2.5 2.5 3.5 5.5 3.5 9S14.5 18.5 12 21"/>
      </svg>

    </div>


    <div class="dock-app"
      title="Terminal"
      onclick="openApp('terminal')"
      style="
        width:52px;
        height:52px;
        border-radius:15px;
        background:rgba(255,255,255,0.1);
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
      ">

      <svg width="28" height="28" viewBox="0 0 24 24"
        fill="none" stroke="white" stroke-width="1.7">
        <rect x="3" y="5" width="18" height="14" rx="2"/>
        <path d="m7 10 3 2-3 2M12 15h4"/>
      </svg>

    </div>


    <div class="dock-app"
      title="Settings"
      onclick="openApp('settings')"
      style="
        width:52px;
        height:52px;
        border-radius:15px;
        background:rgba(255,255,255,0.1);
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
      ">

      <svg width="28" height="28" viewBox="0 0 24 24"
        fill="none" stroke="white" stroke-width="1.7">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3-2.3 1a7 7 0 0 0-1.7-1L14.5 4h-5l-.4 2.5a7 7 0 0 0-1.7 1l-2.3-1-2 3L5.1 11a7 7 0 0 0 0 2l-2 1.5 2 3 2.3-1a7 7 0 0 0 1.7 1l.4 2.5h5l.4-2.5a7 7 0 0 0 1.7-1l2.3 1 2-3-2-1.5c.1-.3.1-.7.1-1z"/>
      </svg>

    </div>

  </div>


  <script>

    function updateClock() {
      const time = new Date();

      document.getElementById("clock").textContent =
        time.toLocaleTimeString();
    }

    updateClock();
    setInterval(updateClock, 1000);


    function openApp(name) {

      const app = document.getElementById(name);

      app.style.display = "block";
      app.style.zIndex = Date.now();

    }


    function closeApp(name) {

      document.getElementById(name).style.display = "none";

    }


    const appTitles =
      document.querySelectorAll(".app-title");


    appTitles.forEach(function(title) {

      title.onmousedown = function(e) {

        if (e.target.classList.contains("app-close")) {
          return;
        }

        const name =
          title.getAttribute("data-window");

        const app =
          document.getElementById(name);

        let startX = e.clientX;
        let startY = e.clientY;

        let startLeft = app.offsetLeft;
        let startTop = app.offsetTop;

        app.style.zIndex = Date.now();


        function moveWindow(e) {

          app.style.left =
            startLeft + e.clientX - startX + "px";

          app.style.top =
            startTop + e.clientY - startY + "px";

        }


        function stopWindow() {

          document.removeEventListener(
            "mousemove",
            moveWindow
          );

          document.removeEventListener(
            "mouseup",
            stopWindow
          );

        }


        document.addEventListener(
          "mousemove",
          moveWindow
        );

        document.addEventListener(
          "mouseup",
          stopWindow
        );

      };

    });


    const apps =
      document.querySelectorAll(".app-window");


    apps.forEach(function(app) {

      app.onmousedown = function() {

        app.style.zIndex = Date.now();

      };

    });


    let dragging = false;

    const windowBox =
      document.getElementById("window");

    const titlebar =
      document.getElementById("titlebar");


    titlebar.onmousedown = function(e) {

      dragging = true;

      windowBox.style.transform = "none";

    };


    document.onmousemove = function(e) {

      if (dragging) {

        windowBox.style.left =
          e.clientX - 260 + "px";

        windowBox.style.top =
          e.clientY - 20 + "px";

      }

    };


    document.onmouseup = function() {

      dragging = false;

    };


    document.getElementById("close").onclick =
      function() {

        windowBox.style.display = "none";

      };


    document.getElementById("minimize").onclick =
      function() {

        windowBox.style.display = "none";

      };


    let calcValue = "";


    function calc(value) {

      calcValue += value;

      document.getElementById(
        "calcDisplay"
      ).value = calcValue;

    }


    function clearCalc() {

      calcValue = "";

      document.getElementById(
        "calcDisplay"
      ).value = "";

    }


    function calculate() {

      try {

        calcValue =
          String(Function(
            "return " + calcValue
          )());

        document.getElementById(
          "calcDisplay"
        ).value = calcValue;

      }

      catch {

        document.getElementById(
          "calcDisplay"
        ).value = "Error";

        calcValue = "";

      }

    }


    document.getElementById(
      "terminalInput"
    ).onkeydown = function(e) {

      if (e.key === "Enter") {

        const command =
          this.value.toLowerCase();

        if (command === "help") {

          document.getElementById(
            "terminalText"
          ).innerHTML +=
            "<br>Commands: help, clear, about";

        }

        else if (command === "about") {

          document.getElementById(
            "terminalText"
          ).innerHTML +=
            "<br>ORBIT OS - personal desktop project";

        }

        else if (command === "clear") {

          document.getElementById(
            "terminalText"
          ).innerHTML = "";

        }

        else {

          document.getElementById(
            "terminalText"
          ).innerHTML +=
            "<br>Command not found";

        }

        this.value = "";

      }

    };

  </script>

</body>
</html>
